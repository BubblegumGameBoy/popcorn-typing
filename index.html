<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポップコーン・タイピング 🍿</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
<link rel="stylesheet" href="styles.css">
<!-- 世界ランキングを使う場合はここに Firebase Realtime DB のURLを設定:
<script>window.LEADERBOARD_URL = 'https://xxxx-default-rtdb.firebaseio.com';</script> -->
</head>
<body>

<div id="bg"></div>
<div id="bg-overlay"></div>

<!-- ====== タイトル ====== -->
<div id="title-screen" class="screen">
  <div class="title-card">
    <h1 class="game-title">🍿 ポップコーン<br>タイピング</h1>
    <p class="subtitle">60秒でどれだけ焼ける！？ 打って弾けさせろ！</p>
    <p class="best-line">ベスト: <span id="title-best">0</span> 粒</p>
    <button id="to-play" class="big-btn">▶ スタート</button>
    <button id="to-shop" class="sub-btn">🛒 ショップ</button>
    <p class="kbd-note">※ キーボードでローマ字入力（PC推奨）</p>
  </div>
</div>

<!-- ====== ショップ ====== -->
<div id="shop-screen" class="screen hidden">
  <header class="shop-head">
    <h2>🛒 ショップ</h2>
    <div class="bank">🍿 <span id="shop-bank">0</span></div>
  </header>
  <div class="shop-scroll">
    <h3 class="shop-cat">🌽 品種（1打鍵の強さ）</h3>
    <div id="shop-varieties" class="card-grid"></div>
    <h3 class="shop-cat">✨ アーティファクト（永久強化）</h3>
    <div id="shop-artifacts" class="card-grid"></div>
  </div>
  <footer class="shop-foot">
    <button id="shop-back" class="sub-btn">← もどる</button>
    <button id="shop-start" class="big-btn">▶ この強さで挑戦！</button>
  </footer>
</div>

<!-- ====== プレイ（60秒） ====== -->
<div id="play-screen" class="screen hidden">
  <header id="play-hud">
    <div class="hud-time">⏱ <span id="time-left">60</span></div>
    <div class="hud-score"><img id="score-icon" alt="">🍿 <span id="run-score">0</span></div>
    <div class="hud-combo" id="play-combo"><span id="play-combo-num">0</span><small>コンボ</small><span id="play-combo-mult">×1</span></div>
  </header>
  <main id="stage">
    <canvas id="fx-canvas"></canvas>
    <div id="typing-panel">
      <div id="word-display">レディ…？</div>
      <div id="romaji-guide"><span id="romaji-done"></span><span id="romaji-left"></span></div>
    </div>
    <div id="time-bar"><div id="time-bar-fill"></div></div>
  </main>
  <div id="countdown" class="hidden"><span id="countdown-num">3</span></div>
</div>

<!-- ====== リザルト ====== -->
<div id="result-screen" class="screen hidden">
  <div class="result-card">
    <h2 class="result-title">タイムアップ！🎉</h2>
    <div class="result-score">🍿 <span id="result-score">0</span></div>
    <p id="result-rankline" class="result-rankline"></p>
    <div class="result-stats">
      <div><span id="result-wpm">0</span><small>WPM</small></div>
      <div><span id="result-acc">100</span><small>%命中</small></div>
      <div><span id="result-combo">0</span><small>最大コンボ</small></div>
      <div><span id="result-words">0</span><small>ワード</small></div>
    </div>

    <div class="rank-tabs">
      <button class="rank-tab active" data-board="local">📱 自己ベスト</button>
      <button class="rank-tab" data-board="global">🌍 世界</button>
    </div>
    <ol id="rank-list" class="rank-list"></ol>

    <div class="result-buttons">
      <button id="result-shop" class="sub-btn">🛒 ショップ</button>
      <button id="result-retry" class="big-btn">🔁 もう一回！</button>
    </div>
  </div>
</div>

<div id="toast-area"></div>

<script src="src/assets.js"></script>
<script src="src/format.js"></script>
<script src="src/config.js"></script>
<script src="src/data/words.js"></script>
<script src="src/typing-engine.js"></script>
<script src="src/effects.js"></script>
<script src="src/leaderboard.js"></script>
<script src="src/game.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
