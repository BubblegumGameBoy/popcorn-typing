<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポップコーン・タイピング 🍿</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 背景 -->
<div id="bg"></div>
<div id="bg-overlay"></div>

<!-- ====== タイトル画面 ====== -->
<div id="title-screen" class="screen">
  <div class="title-card">
    <h1 class="game-title">🍿 ポップコーン<br>タイピング</h1>
    <p class="subtitle">打って、焼いて、世界をポップコーンで埋めつくせ！</p>
    <button id="start-btn" class="big-btn">▶ はじめる</button>
    <p class="kbd-note">※ キーボードでローマ字入力するゲームです（PC推奨）</p>
  </div>
</div>

<!-- ====== ゲーム画面 ====== -->
<div id="game-screen" class="screen hidden">

  <!-- 上部HUD -->
  <header id="hud">
    <div class="hud-main">
      <img id="hud-corn-icon" alt="popcorn">
      <div class="hud-counts">
        <div id="popcorn-count">0</div>
        <div id="cps-line"><span id="cps-count">0</span> 粒/秒</div>
      </div>
    </div>
    <div class="hud-stats">
      <div class="stat"><span class="stat-label">レベル</span><span id="level-count">1</span></div>
      <div class="stat"><span class="stat-label">1打鍵</span><span id="perchar-count">1</span></div>
      <div class="stat salt-stat"><img id="salt-icon" alt="salt"><span id="salt-count">0</span></div>
      <button id="mute-btn" class="icon-btn" title="音のオン/オフ">🔊</button>
    </div>
  </header>

  <!-- メイン：タイピング -->
  <main id="stage">
    <canvas id="fx-canvas"></canvas>

    <!-- 目的：ポップコーンの容器を満タンにする（CSS/SVGで描画） -->
    <div id="container-wrap">
      <div id="container-name">Sカップ</div>
      <div id="container-box">
        <div id="container-fill"><div id="container-foam"></div></div>
        <div id="container-stripes"></div>
        <div id="container-logo">POPCORN</div>
      </div>
      <div id="container-amount">0 / 300</div>
      <div id="container-bar"><div id="container-bar-fill"></div></div>
    </div>

    <div id="combo-badge" class="hidden">
      <span id="combo-num">0</span><span class="combo-x">コンボ</span>
      <span id="combo-mult">×1</span>
    </div>

    <div id="typing-panel">
      <div id="word-display">レディ…？</div>
      <div id="romaji-guide"><span id="romaji-done"></span><span id="romaji-left"></span></div>
    </div>

    <!-- ポップコーン生成ゲージ（今どれだけ作ってるか） -->
    <div id="gen-gauge" title="いまのポップコーン生成いきおい">
      <div id="gen-fill"></div>
      <div id="gen-spark">🍿</div>
      <div id="gen-label">0<small>粒/秒</small></div>
    </div>

    <!-- 数字キーでキーボード完結（マウス不要） -->
    <div id="key-hints">
      <button class="key-hint" data-key="1"><kbd>1</kbd><span class="kh-name">品種研究</span><span class="kh-cost" id="kh-variety"></span></button>
      <button class="key-hint" data-key="2"><kbd>2</kbd><span class="kh-name">レベルUP</span><span class="kh-cost" id="kh-level"></span></button>
      <button class="key-hint" data-key="3"><kbd>3</kbd><span class="kh-name">設備をふやす</span><span class="kh-cost" id="kh-equip"></span></button>
    </div>
  </main>

  <!-- 右：ショップ -->
  <aside id="shop">
    <nav id="shop-tabs">
      <button class="tab active" data-tab="variety">🌽 品種</button>
      <button class="tab" data-tab="equip">⚙️ 設備</button>
      <button class="tab" data-tab="prestige">🧂 転生</button>
    </nav>
    <div id="shop-body">
      <section id="tab-variety" class="tab-panel active"></section>
      <section id="tab-equip" class="tab-panel"></section>
      <section id="tab-prestige" class="tab-panel"></section>
    </div>
  </aside>

</div>

<!-- トースト -->
<div id="toast-area"></div>

<!-- スクリプト（依存順） -->
<script src="src/assets.js"></script>
<script src="src/format.js"></script>
<script src="src/config.js"></script>
<script src="src/data/words.js"></script>
<script src="src/typing-engine.js"></script>
<script src="src/effects.js"></script>
<script src="src/game.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
